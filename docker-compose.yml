# Docker has a 5.6 GB total memory budget on this machine.
# Zetaris is NOT run locally; it runs on AWS (see integrations/ACCESS.md).
services:
  core:
    build: .
    mem_limit: 3g
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./runs:/app/runs
      - ./logs:/app/logs

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    mem_limit: 256m
    ports:
      - "8080:80"
    depends_on:
      - core

