# Docker has a 5.6 GB total memory budget on this machine.
# Zetaris is NOT run locally; it runs on AWS (see integrations/ACCESS.md).
services:
  core:
    build: .
    mem_limit: 3g
    ports:
      - "${CORE_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - core-runs:/app/runs
      - core-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 24

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    mem_limit: 256m
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      core:
        condition: service_healthy

  # Future Meterless sidecar; commented out because it does not exist yet.
  # engines:
  #   build:
  #     context: integrations/engines
  #   ports:
  #     - "8790:8790"
  #   environment:
  #     ENGINES_TOKEN: ${ENGINES_TOKEN:-} # Optional

volumes:
  core-runs:
  core-logs:
