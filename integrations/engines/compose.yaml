services:
  engines:
    build:
      context: ../..
      dockerfile: integrations/engines/Dockerfile
    ports:
      - "127.0.0.1:8790:8790"
    environment:
      ENGINES_HOST: 0.0.0.0
      ENGINES_PORT: 8790
      ENGINES_DATA_DIR: /data
      ENGINES_TOKEN: ${ENGINES_TOKEN:-}
    volumes:
      - engines-data:/data
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8790/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  engines-data:
